# Website options
title: Staticast
baseline: The easiest way to publish your podcast
description: This is a demo of Staticast, the easiest way to publish your 🎙️ podcast.
keywords: [Podcast, Cecil, Static Site Generator]
author: Arnaud Ligny
copyright: Arnaud Ligny
image: og-card.png
language: en
languages:
  - code: en
    name: English
    locale: en_US
  - code: fr
    name: Français
    locale: fr_FR
    config:
      baseline: La façon la plus simple de publier votre podcast
      description: Ceci est une démo de Staticast, la façon la plus simple de publier votre 🎙️ podcast.
      menus:
        main:
          - id: index
            enabled: false
          - id: episodes
            weight: 1
menus:
  main:
    - id: index
      enabled: false
    - id: episodes
      weight: 1
theme:
  - flexsearch
  - pwa
  - netlify
manifest:
  background_color: "#7E4EA3"
  theme_color: "#7E4EA3"
  icons:
    - manifest/icon-192x192.png
    - manifest/icon-512x512.png
    - src: manifest/icon-192x192-maskable.png
      purpose: maskable
    - src: manifest/icon-512x512-maskable.png
      purpose: maskable
  screenshots:
    - manifest/screenshot-desktop.png
    - manifest/screenshot-desktop-dark.png
    - manifest/screenshot-mobile.png
    - manifest/screenshot-mobile-dark.png
  shortcuts: true
serviceworker:
  enabled: true
  precache:
    - manifest/icon-192x192.png
    - manifest/icon-512x512.png
    - manifest/icon-192x192-maskable.png
    - manifest/icon-512x512-maskable.png
    - manifest/screenshot-desktop.png
    - manifest/screenshot-desktop-dark.png
    - manifest/screenshot-mobile.png
    - manifest/screenshot-mobile-dark.png

# Podcast options
podcast:
  owner:
    name: Arnaud Ligny
    email: arnaud@ligny.fr
  image: cover.png
  author: Arnaud Ligny
  categories:
    - Technology
  type: episodic
  subscribe:
    - name: apple
      title: Apple Podcasts
      url: https://podcasts.apple.com/fr/podcast/staticast/id1520249637
      enabled: true
    - name: spotify
      title: Spotify
      url: https://open.spotify.com/show/6dlhe4G6Au5Zm7qX2M5tnS
      enabled: true
  hoster:
    - name: Arnaud Ligny
      avatar: https://github.com/arnaudligny.png?size=150
      url: https://arnaudligny.fr
    - name: Cecil
      avatar: https://github.com/cecilapp.png?size=150
      url: https://cecil.app

# Search options
flexsearch:
  sections:
    episodes:
      limit: 10
      split: false
      date: true

# Cecil options
pages:
  pagination:
    max: 10
  default:
    xsl/podcast:
      path: xsl/podcast
      layout: podcast
      output: xsl
      uglyurl: true
      published: true
      excluded: true
      serviceworker:
        precache: false
    serviceworker:
      path: serviceworker
      layout: sw
      output: js
output:
  pagetypeformats:
    homepage: [html]
    section: [html, rss]
netlify:
  redirects:
    - from: https://staticast-demo.netlify.app/*
      to: https://staticast-demo.cecil.app/:splat
      status: 301
      force: true
